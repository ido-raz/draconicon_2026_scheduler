  /* ============ GOOGLE DRIVE SAVE / LOAD ============ */
  const DRIVE_CLIENT_ID = '144001235867-kqnmb9q2d20uh3odj27ac4c5kbjua50h.apps.googleusercontent.com';
  const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
  const DRIVE_FILE_ID_KEY = 'dragoncon2026.drive.fileId';

  let driveTokenClient = null;
  let driveAccessToken = null;
  let driveTokenExpiry = 0;

  function driveLibReady(){
    return typeof google !== 'undefined' && google.accounts && google.accounts.oauth2;
  }

  function getDriveToken(){
    return new Promise((resolve, reject) => {
      if (!driveLibReady()){
        reject(new Error('gis-not-loaded'));
        return;
      }
      if (driveAccessToken && Date.now() < driveTokenExpiry - 60000){
        resolve(driveAccessToken);
        return;
      }
      if (!driveTokenClient){
        driveTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: DRIVE_CLIENT_ID,
          scope: DRIVE_SCOPE,
          callback: () => {}
        });
      }
      driveTokenClient.callback = (resp) => {
        if (resp.error){ reject(resp); return; }
        driveAccessToken = resp.access_token;
        driveTokenExpiry = Date.now() + (Number(resp.expires_in || 3600) * 1000);
        resolve(driveAccessToken);
      };
      driveTokenClient.requestAccessToken();
    });
  }

  async function driveFetch(url, options){
    const token = await getDriveToken();
    const res = await fetch(url, {
      ...options,
      headers: { ...(options && options.headers || {}), Authorization: 'Bearer ' + token }
    });
    if (!res.ok){
      const body = await res.text().catch(()=> '');
      const err = new Error('drive-http-' + res.status);
      err.status = res.status; err.body = body;
      throw err;
    }
    return res;
  }

  async function driveListFiles(){
    const q = encodeURIComponent(`name = '${SUGGESTED_NAME}' and trashed = false`);
    const res = await driveFetch(
      `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc&spaces=drive`
    );
    const json = await res.json();
    return json.files || [];
  }

  async function driveCreateFile(text){
    const boundary = 'dcbnd_' + Date.now();
    const metadata = { name: SUGGESTED_NAME, mimeType: 'text/plain' };
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n${text}\r\n` +
      `--${boundary}--`;
    const res = await driveFetch(
      'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime',
      { method:'POST', headers:{'Content-Type': `multipart/related; boundary=${boundary}`}, body }
    );
    return res.json();
  }

  async function driveUpdateFile(fileId, text){
    const res = await driveFetch(
      `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media&fields=id,name,modifiedTime`,
      { method:'PATCH', headers:{'Content-Type':'text/plain; charset=UTF-8'}, body:text }
    );
    return res.json();
  }

  async function driveGetContent(fileId){
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    return res.text();
  }

  function driveErrorToast(err){
    console.error(err);
    if (err && err.message === 'gis-not-loaded'){
      toast('שירות ההתחברות של גוגל עדיין נטען, או שאין חיבור לאינטרנט. נסו שוב בעוד רגע.', true);
    } else if (err && (err.error === 'popup_closed_by_user' || err.type === 'popup_closed')){
      toast('חלון ההתחברות נסגר לפני שהאישור הושלם.', true);
    } else if (err && err.status === 403){
      toast('גוגל דרייב סירב את הגישה. ודאו שהחשבון שלכם רשום כ"משתמש בדיקה" בפרויקט.', true);
    } else {
      toast('שגיאה בתקשורת עם גוגל דרייב. נסו שוב.', true);
    }
  }

  document.getElementById('btn-drive-save').addEventListener('click', async () => {
    const text = buildFileText();
    try{
      toast('שומר לגוגל דרייב…');
      let fileId = localStorage.getItem(DRIVE_FILE_ID_KEY);
      let ok = false;
      if (fileId){
        try{ await driveUpdateFile(fileId, text); ok = true; }
        catch(e){ fileId = null; }
      }
      if (!ok){
        const matches = await driveListFiles();
        if (matches.length){
          fileId = matches[0].id;
          await driveUpdateFile(fileId, text);
        } else {
          const created = await driveCreateFile(text);
          fileId = created.id;
        }
      }
      localStorage.setItem(DRIVE_FILE_ID_KEY, fileId);
      setDirty(false);
      toast('נשמר בגוגל דרייב בהצלחה.');
    }catch(err){ driveErrorToast(err); }
  });

  function showDriveChooser(files){
    return new Promise(resolve => {
      const backdrop = document.getElementById('drive-modal-backdrop');
      const list = document.getElementById('drive-modal-list');
      list.innerHTML = '';
      files.forEach(f => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'drive-modal-item';
        const when = f.modifiedTime ? new Date(f.modifiedTime).toLocaleString('he-IL') : '';
        btn.innerHTML = `<span>${f.name}</span><span class="dmi-when">${when}</span>`;
        btn.addEventListener('click', () => { close(); resolve(f); });
        list.appendChild(btn);
      });
      function close(){ backdrop.classList.remove('show'); cancelBtn.removeEventListener('click', onCancel); }
      function onCancel(){ close(); resolve(null); }
      const cancelBtn = document.getElementById('drive-modal-cancel');
      cancelBtn.addEventListener('click', onCancel);
      backdrop.classList.add('show');
    });
  }

  document.getElementById('btn-drive-load').addEventListener('click', async () => {
    try{
      toast('מתחבר לגוגל דרייב…');
      const matches = await driveListFiles();
      if (!matches.length){
        toast('לא נמצא קובץ בחירה שמור בגוגל דרייב עבור האפליקציה הזו.', true);
        return;
      }
      let chosen = matches[0];
      if (matches.length > 1) chosen = await showDriveChooser(matches);
      if (!chosen) return;
      const text = await driveGetContent(chosen.id);
      localStorage.setItem(DRIVE_FILE_ID_KEY, chosen.id);
      applyLoaded(parseFileText(text), 'מגוגל דרייב');
    }catch(err){ driveErrorToast(err); }
  });

  /* ============ TOOLBAR COLLAPSE / EXPAND ============ */
  (function initToolbarCollapse(){
    const toolbarEl = document.querySelector('.toolbar');
    const btn = document.getElementById('btn-collapse-toolbar');
    const label = document.getElementById('collapse-btn-label');
    btn.addEventListener('click', () => {
      const collapsed = toolbarEl.classList.toggle('is-collapsed');
      btn.setAttribute('aria-expanded', String(!collapsed));
      label.textContent = collapsed ? 'הרחב' : 'צמצם';
      btn.setAttribute('aria-label', collapsed ? 'הרחב את הסרגל' : 'צמצם את הסרגל');
    });
  })();

  /* ============ RESTORE BANNER ============ */
  (function initRestore(){
    if(!storageOK){
      showStorageNote('הדפדפן חוסם אחסון מקומי במצב הנוכחי, ולכן הגיבוי האוטומטי אינו פעיל. שמרו לקובץ .drkc כדי לא לאבד את הבחירה.');
      return;
    }
    const b=readBackup();
    if(!b) return;
    const when=b.savedAt?new Date(b.savedAt):null;
    const nEv=b.marks?Object.keys(b.marks).length:0;
    const nP=(b.participants||[]).filter(p=>p.name&&p.name.trim()).length;
    const nF=b.filtered?Object.keys(b.filtered).length:0;
    document.getElementById('restore-text').innerHTML =
      `<b>נמצא גיבוי אוטומטי</b> מ-${when?when.toLocaleString('he-IL'):'תאריך לא ידוע'} — ${nEv} אירועים ו-${nP} משתתפים${nF?`, ${nF} מסוננים`:''}. לשחזר?`;
    const banner=document.getElementById('restore-banner');
    banner.classList.add('show');
    document.getElementById('restore-yes').addEventListener('click',()=>{
      state.participants=(b.participants||[]).map((p,i)=>({
        id:p.id, name:p.name||'', age:(p.age===''||p.age===null||isNaN(p.age))?'':Number(p.age),
        color:p.color||PART_COLORS[i%PART_COLORS.length]
      }));
      ensureSlots();
      const valid=new Set(state.participants.map(p=>p.id));
      state.marks={};
      Object.keys(b.marks||{}).forEach(id=>{
        if(!EVENTS_BY_ID.has(id)) return;
        const m=b.marks[id]||{};
        const cleanParts={};
        if (Array.isArray(m.parts)){
          // legacy backup shape: plain assignment array + separate global prio/reg
          const status = m.reg ? 'reg' : (m.prio && Object.prototype.hasOwnProperty.call(PSTATUS_LABEL,m.prio) ? m.prio : 'dash');
          m.parts.forEach(pid=>{ if (valid.has(pid)) cleanParts[pid]=status; });
        } else if (m.parts && typeof m.parts==='object'){
          Object.keys(m.parts).forEach(pid=>{
            const n=Number(pid);
            if (valid.has(n)) cleanParts[n]=m.parts[pid];
          });
        }
        state.marks[id]={parts:cleanParts};
      });
      state.filtered={};
      Object.keys(b.filtered||{}).forEach(id=>{
        if (EVENTS_BY_ID.has(id) && !isSelected(id)) state.filtered[id]=true;
      });
      banner.classList.remove('show');
      afterStateChange({rerenderParts:true, markDirty:false});
      setDirty(true);
      toast('הגיבוי שוחזר. מומלץ לשמור לקובץ .drkc.');
    });
    document.getElementById('restore-no').addEventListener('click',()=>banner.classList.remove('show'));
  })();

  /* ============ INIT ============ */
  ensureSlots();
  recomputeConflicts();
  syncAllCards();
  updateCounters();
  applyFilters();
  renderParticipantTabs();
  setDirty(false);

})();
</script>
</body>
