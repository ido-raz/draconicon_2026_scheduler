<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דרקוניקון 2026 - תוכנייה לשיבוץ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html{ font-size:19px; }

  :root{
    --page-bg:#eceef2;
    --page-bg-2:#e3e6ec;

    --toolbar-surface:#17171b;
    --toolbar-surface-2:#232329;
    --toolbar-text:#f4f4f6;
    --toolbar-text-soft:#a9a9b4;
    --toolbar-line:#2e2e36;

    --filter-bg:#bc2a30;
    --filter-bg-2:#a72328;
    --filter-line:#8d1f24;

    --card-bg:#ffffff;
    --card-line:#dfe3ea;
    --card-line-strong:#c3cad6;

    --chip-white:#ffffff;
    --chip-tint:#f4f6fa;

    --ink:#152a4d;
    --ink-soft:#61708c;

    --brand:#2b5fc7;
    --brand-bright:#3f74dd;
    --brand-tint:#e9effb;

    --red:#c1272d;
    --red-tint:#fdecec;

    --amber:#a86a00;
    --amber-tint:#fdf3e0;

    --green:#1e8a4c;
    --check-green:#7CE38B;

    --cat-color:#1d4ed8;
    --cat-tint:#dbeafe;

    --subcat-color:#6d28d9;
    --subcat-tint:#ede9fe;

    --age-color:#374151;
    --age-tint:#eef0f3;

    --seats-color:#15803d;
    --seats-tint:#dcfce7;

    --header-grad-1:#f9a825;
    --header-grad-2:#fdd835;

    --tab-chip-bg:#669bbc;
    --tab-chip-bg-2:#7fb0cf;
    --tab-selected-bg:#780000;
    --tab-unselected-bg:#a7cee8;
    --toolbar-outer-bg:#003049;

    --card-header-bg:#12172b;
    --card-header-date:#aab2c9;
    --card-header-time:#f0b90b;

    --col-head-bg:#f6c9c9;

    --shadow-xs: 0 1px 2px rgba(21,42,77,.06);
    --shadow-sm: 0 2px 6px rgba(21,42,77,.08), 0 1px 2px rgba(21,42,77,.05);
    --shadow-md: 0 6px 18px rgba(21,42,77,.11), 0 2px 5px rgba(21,42,77,.06);
    --shadow-lg: 0 14px 36px rgba(21,42,77,.16), 0 4px 10px rgba(21,42,77,.08);

    --r-sm:8px; --r-md:12px; --r-lg:16px;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(1200px 400px at 15% -5%, #fff 0%, transparent 60%),
      linear-gradient(180deg, var(--page-bg) 0%, var(--page-bg-2) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Assistant', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--brand); color:#fff; }
  :focus-visible{ outline:3px solid var(--brand-bright); outline-offset:2px; border-radius:4px; }

  /* ===== Header ===== */
  header.site-head{ padding:13px 20px 11px; background:linear-gradient(90deg, var(--header-grad-1), var(--header-grad-2)); }
  .head-row{ display:flex; align-items:center; gap:9px; justify-content:center; }
  .flourish{ width:26px; height:26px; flex:0 0 auto; }
  .flourish path{ fill:var(--brand); }
  h1.site-title{
    font-family:'Rubik',sans-serif; font-weight:700; font-size:1.35rem;
    letter-spacing:-.01em; margin:0; color:var(--ink); text-align:center;
  }
  .eyebrow{
    display:block; text-align:center; font-family:'Rubik',sans-serif; font-weight:600;
    font-size:.72rem; letter-spacing:.18em; color:var(--ink-soft); margin-top:3px; text-transform:uppercase;
  }

  /* ===== Toolbar ===== */
  .toolbar{
    display:flex; align-items:center; gap:14px; padding:11px 18px; flex-wrap:wrap;
    background:var(--toolbar-outer-bg);
    position:sticky; top:0; z-index:60;
    box-shadow:0 4px 18px rgba(0,0,0,.28);
  }
  .collapse-btn{
    display:flex; align-items:center; gap:6px; flex:0 0 auto;
    background:var(--tab-chip-bg); border:1px solid var(--toolbar-line); border-radius:999px;
    padding:7px 14px; color:#000; font-family:'Assistant',sans-serif; font-size:.8rem; font-weight:700;
    cursor:pointer; transition:background .15s, color .15s, border-color .15s;
  }
  .collapse-btn:hover{ background:var(--tab-chip-bg-2); color:#000; border-color:var(--brand-bright); }
  .collapse-btn svg{ width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2.4; transition:transform .22s ease; }
  .toolbar.is-collapsed{
    width:fit-content; margin-inline-start:auto; padding:8px 12px; border-radius:0 0 0 14px;
  }
  .toolbar.is-collapsed .tabs, .toolbar.is-collapsed .file-actions{ display:none; }
  .toolbar.is-collapsed .collapse-btn svg{ transform:rotate(180deg); }
  .tabs{ display:flex; gap:5px; background:var(--tab-chip-bg); padding:4px; border-radius:11px; border:1px solid var(--toolbar-line); flex-wrap:wrap; }
  .tab-btn{
    font-family:'Rubik',sans-serif; font-weight:600; font-size:.9rem;
    color:#000; background:var(--tab-unselected-bg); border:none;
    padding:9px 16px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; gap:7px;
    transition:background .18s ease, color .18s ease;
  }
  .tab-btn:hover{ color:#000; background:var(--tab-chip-bg-2); }
  .tab-btn[aria-selected="true"]{
    background:var(--tab-selected-bg);
    color:#fff; box-shadow:0 3px 12px rgba(43,95,199,.5);
  }
  .tab-btn[aria-selected="true"]:hover{ background:var(--tab-selected-bg); }
  .tab-badge{
    display:inline-flex; align-items:center; justify-content:center; min-width:21px; height:21px; padding:0 6px;
    background:rgba(255,255,255,.14); color:#fff; border-radius:999px;
    font-size:.72rem; font-weight:700; font-family:'Rubik',sans-serif;
  }
  .tab-btn[aria-selected="true"] .tab-badge{ background:rgba(0,0,0,.22); }

  .file-actions{ display:flex; gap:7px; margin-inline-start:auto; align-items:center; }
  .fa-sep{ width:1px; align-self:stretch; margin:6px 2px; background:var(--toolbar-line); }

  .drive-modal-backdrop{
    position:fixed; inset:0; background:rgba(10,10,14,.55); z-index:300;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .drive-modal-backdrop.show{ display:flex; }
  .drive-modal{
    background:#fff; border-radius:var(--r-md); box-shadow:var(--shadow-lg);
    max-width:440px; width:100%; padding:18px; max-height:80vh; overflow:auto;
  }
  .drive-modal h3{ font-family:'Rubik',sans-serif; font-size:1.05rem; margin:0 0 12px; color:var(--ink); }
  .drive-modal-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:100%; text-align:start; background:var(--chip-tint); border:1px solid var(--card-line);
    border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer; font-family:'Assistant',sans-serif;
    transition:background .15s, border-color .15s;
  }
  .drive-modal-item:hover{ background:var(--brand-tint); border-color:var(--brand); }
  .drive-modal-item .dmi-when{ font-size:.78rem; color:var(--ink-soft); white-space:nowrap; }
  .drive-modal-cancel{
    width:100%; margin-top:6px; background:none; border:none; color:var(--ink-soft);
    font-weight:700; font-size:.85rem; cursor:pointer; padding:8px;
  }
  .drive-modal-cancel:hover{ color:var(--red); }
  .save-dot{
    width:9px; height:9px; border-radius:50%; background:#f0a020; flex:0 0 auto;
    margin-inline-end:2px; display:none;
  }
  .save-dot.show{ display:block; }
  .sq-btn{
    width:42px; height:42px; border-radius:10px; border:1px solid var(--toolbar-line);
    background:var(--tab-chip-bg); color:#000;
    display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
    transition:transform .14s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease, color .18s ease;
  }
  .sq-btn:hover{ background:var(--tab-chip-bg-2); border-color:var(--brand-bright); color:#000; transform:translateY(-2px); box-shadow:0 6px 16px rgba(43,95,199,.32); }
  .sq-btn:active{ transform:translateY(0); }
  .sq-btn svg{ width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .sq-btn .tip{
    position:absolute; top:calc(100% + 9px); right:50%; transform:translateX(50%) translateY(-4px);
    background:var(--tab-chip-bg-2); color:var(--toolbar-text); font-size:.72rem; font-weight:600;
    padding:5px 10px; border-radius:7px; white-space:nowrap; border:1px solid var(--toolbar-line);
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease; z-index:5;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
  }
  .sq-btn:hover .tip{ opacity:1; transform:translateX(50%) translateY(0); }

  /* ===== Toasts ===== */
  .toast-wrap{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:9px; align-items:center; }
  .toast{
    display:flex; align-items:center; gap:9px; background:var(--toolbar-surface);
    border:1px solid var(--toolbar-line); border-inline-start:4px solid var(--green);
    color:var(--toolbar-text); padding:12px 18px; border-radius:10px; box-shadow:var(--shadow-lg);
    font-size:.86rem; font-weight:600; animation:toastIn .26s cubic-bezier(.2,.9,.3,1.2);
    transition:opacity .3s ease, transform .3s ease;
  }
  .toast.err{ border-inline-start-color:#ff6b6b; }
  @keyframes toastIn{ from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:none;} }

  main{ max-width:1180px; margin:0 auto; padding:18px 16px 70px; }

  /* ===== Restore banner ===== */
  .restore-banner{
    display:none; align-items:center; gap:12px; flex-wrap:wrap;
    background:var(--amber-tint); border:1px solid #e9d3a6; border-inline-start:4px solid #d99a1c;
    border-radius:var(--r-md); padding:13px 16px; margin-bottom:16px; box-shadow:var(--shadow-sm);
  }
  .restore-banner.show{ display:flex; }
  .restore-banner svg{ width:20px; height:20px; stroke:var(--amber); fill:none; stroke-width:2; flex:0 0 auto; }
  .restore-banner .rb-text{ font-size:.88rem; line-height:1.6; flex:1 1 240px; }
  .restore-banner .rb-text b{ color:var(--amber); }
  .btn-mini{
    border:1px solid var(--card-line-strong); background:#fff; color:var(--ink);
    font-family:'Assistant',sans-serif; font-size:.82rem; font-weight:700;
    padding:7px 15px; border-radius:999px; cursor:pointer; box-shadow:var(--shadow-xs);
    transition:background .16s ease, transform .14s ease;
  }
  .btn-mini:hover{ background:var(--chip-tint); transform:translateY(-1px); }
  .btn-mini.primary{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .btn-mini.primary:hover{ background:var(--brand-bright); }

  .storage-note{
    display:none; background:var(--red-tint); border:1px solid #f0b8b8; border-inline-start:4px solid var(--red);
    border-radius:var(--r-md); padding:11px 15px; margin-bottom:16px; font-size:.84rem; line-height:1.6;
  }
  .storage-note.show{ display:block; }

  /* ===== Filter bar ===== */
  .filter-bar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:13px; margin-bottom:8px;
    background:linear-gradient(180deg, var(--filter-bg) 0%, var(--filter-bg-2) 100%);
    border:1px solid var(--filter-line); border-radius:var(--r-md); box-shadow:var(--shadow-md);
  }
  .search-box{
    flex:1 1 230px; display:flex; align-items:center; gap:9px; background:#fff;
    border:1px solid var(--filter-line); border-radius:var(--r-sm); padding:9px 13px; transition:box-shadow .18s ease;
  }
  .search-box:focus-within{ box-shadow:0 0 0 3px rgba(255,255,255,.5); }
  .search-box svg{ width:17px; height:17px; stroke:var(--ink-soft); fill:none; stroke-width:2; flex:0 0 auto; }
  .search-box input{ flex:1; background:transparent; border:none; outline:none; color:var(--ink); font-family:'Assistant',sans-serif; font-size:.95rem; min-width:0; }
  .search-box input::placeholder{ color:#9aa6bb; }
  .clear-search{ border:none; background:transparent; cursor:pointer; padding:2px; display:none; color:var(--ink-soft); line-height:0; }
  .clear-search svg{ width:15px; height:15px; stroke-width:2.4; }
  .clear-search:hover{ color:var(--red); }
  .search-box.has-value .clear-search{ display:block; }

  .pill-group{ display:flex; gap:5px; flex-wrap:wrap; }
  .pill-toggle{
    font-family:'Assistant',sans-serif; font-size:.84rem; font-weight:700;
    padding:8px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.55);
    background:rgba(255,255,255,.13); color:#fff; cursor:pointer;
    transition:background .16s ease, color .16s ease, border-color .16s ease, transform .12s ease;
  }
  .pill-toggle:hover{ background:rgba(255,255,255,.26); }
  .pill-toggle[aria-pressed="true"]{ background:#fff; border-color:#fff; color:var(--filter-bg-2); }
  .pill-toggle:active{ transform:scale(.97); }

  select.mini-select{
    background:#fff; color:var(--ink); border:1px solid var(--filter-line); border-radius:var(--r-sm);
    padding:9px 12px; font-family:'Assistant',sans-serif; font-size:.87rem; font-weight:600; cursor:pointer; max-width:205px;
  }

  .filter-meta{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:0 4px; margin-bottom:14px; min-height:26px; }
  .result-count{ font-size:.82rem; color:var(--ink-soft); font-weight:600; }
  .filtered-note{ font-weight:500; opacity:.85; }
  .result-count b{ color:var(--ink); }
  .link-btn{
    background:none; border:none; padding:0; cursor:pointer; font-family:'Assistant',sans-serif;
    font-size:.82rem; font-weight:700; color:var(--brand); border-bottom:1px solid transparent;
    transition:border-color .16s ease;
  }
  .link-btn:hover{ border-bottom-color:var(--brand); }
  .link-btn.danger{ color:var(--red); }
  .link-btn.danger:hover{ border-bottom-color:var(--red); }

  /* ===== Day heading ===== */
  .date-heading{ display:flex; align-items:center; gap:11px; margin:26px 0 12px; position:sticky; top:66px; z-index:20; }
  .date-heading:first-of-type{ margin-top:6px; }
  .date-heading .banner{
    display:flex; align-items:center; gap:9px; font-family:'Rubik',sans-serif; font-weight:700; font-size:1.02rem;
    background:#fff; border:1px solid var(--card-line-strong); border-radius:999px;
    padding:8px 18px; color:var(--ink); box-shadow:var(--shadow-md);
  }
  .date-heading .banner .dot{ width:9px; height:9px; border-radius:50%; background:var(--brand); flex:0 0 auto; }
  .day-count{ font-size:.74rem; font-weight:700; color:var(--brand); background:var(--brand-tint); border-radius:999px; padding:2px 9px; }
  .date-heading .rule{ flex:1; height:2px; border-radius:2px; background:linear-gradient(to left, var(--card-line-strong), transparent); }

  .event-list{ display:flex; flex-direction:column; gap:10px; }

  /* ===== Event card (tab 1) ===== */
  .event-card{
    background:var(--card-bg); border:1px solid var(--card-line); border-radius:var(--r-md);
    box-shadow:var(--shadow-sm); position:relative; overflow:hidden;
    transition:border-color .18s ease, box-shadow .2s ease, transform .16s ease;
  }
  .event-card:hover{ box-shadow:var(--shadow-md); border-color:var(--card-line-strong); transform:translateY(-1px); }
  .event-card.is-checked{ border-color:var(--brand); box-shadow:0 0 0 1px var(--brand), var(--shadow-md); }
  .event-card.is-conflict{ border-color:var(--red); box-shadow:0 0 0 1px var(--red), var(--shadow-md); }
  .event-card.is-expanded{ box-shadow:var(--shadow-lg); border-color:var(--brand); }
  .event-card.is-hidden{ display:none; }

  .event-row{ display:flex; align-items:stretch; gap:0; cursor:pointer; }

  /* right-hand strip: checkbox + date + time + selection extras */
  .event-side{
    flex:0 0 auto; width:118px; background:var(--card-header-bg);
    border-inline-end:1px solid rgba(255,255,255,.1);
    display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:12px 8px; text-align:center;
  }
  .side-date{ font-family:'Rubik',sans-serif; font-weight:700; font-size:.8rem; color:var(--card-header-date); margin-top:2px; }
  .side-time{ font-family:'Rubik',sans-serif; font-weight:700; font-size:1.02rem; color:var(--card-header-time); line-height:1.25; }
  .side-time .dash{ display:block; font-size:.72rem; color:rgba(255,255,255,.45); line-height:1; margin:1px 0; }

  .filter-btn{
    display:flex; align-items:center; justify-content:center; gap:4px; margin-top:7px;
    background:none; border:1px dashed rgba(255,255,255,.35); border-radius:999px;
    padding:4px 9px; font-size:.7rem; font-weight:600; color:rgba(255,255,255,.8); cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .filter-btn:hover{ background:var(--red-tint); color:var(--red); border-color:var(--red); }
  .filter-btn svg{ width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2; flex:0 0 auto; }
  /* requirement: once an event is marked as attending, the filter-out option disappears */
  .event-card.is-checked .filter-btn{ display:none; }

  .mc-toprow{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .mc-deselect-btn{
    display:flex; align-items:center; gap:3px; flex:0 0 auto; white-space:nowrap;
    background:none; border:1px solid var(--card-line-strong); border-radius:999px;
    padding:2px 8px; font-size:.6rem; font-weight:700; color:var(--ink-soft); cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .mc-deselect-btn:hover{ background:var(--red-tint); color:var(--red); border-color:var(--red); }
  .mc-deselect-btn svg{ width:9px; height:9px; stroke-width:3; }

  .seal-wrap{ flex:0 0 auto; padding:2px; cursor:pointer; }
  .seal{
    width:34px; height:34px; border-radius:50%; border:2px solid var(--card-line-strong);
    background:#fff; display:flex; align-items:center; justify-content:center; position:relative;
    transition:border-color .18s ease, box-shadow .22s ease, background .18s ease, transform .14s ease;
  }
  .seal-wrap:hover .seal{ border-color:var(--brand); background:var(--brand-tint); transform:scale(1.06); }
  .seal input[type="checkbox"]{ position:absolute; inset:0; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .seal svg{
    width:19px; height:19px; fill:none; stroke:var(--check-green); stroke-width:3;
    stroke-linecap:round; stroke-linejoin:round; opacity:0; transform:scale(.4);
    transition:opacity .18s ease, transform .24s cubic-bezier(.2,.9,.3,1.5); pointer-events:none;
  }
  .seal.checked{ border-color:var(--green); background:#0f2f1e; box-shadow:0 0 0 4px rgba(30,138,76,.16); }
  .seal.checked svg{ opacity:1; transform:scale(1); }
  .seal:has(input:focus-visible){ outline:3px solid var(--brand-bright); outline-offset:3px; }

  .event-body{ flex:1; min-width:0; display:flex; align-items:flex-start; gap:12px; padding:14px 16px; }
  .event-main{ flex:1; min-width:0; }

  .event-name{
    font-family:'Rubik',sans-serif; font-weight:600; font-size:1.12rem; color:var(--ink);
    display:block; margin-bottom:6px; line-height:1.4; letter-spacing:-.01em; transition:color .16s ease;
  }
  .event-row:hover .event-name{ color:var(--brand); }

  .event-tags-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .pill{ font-size:.8rem; font-weight:700; padding:3px 10px; border-radius:999px; color:#fff; white-space:nowrap; line-height:1.55; }
  .pill.cat-tag{ background:var(--cat-tint); color:var(--cat-color); font-size:.66rem; }
  .pill.subcat-tag{ background:var(--subcat-tint); color:var(--subcat-color); font-size:.66rem; }
  .pill.age-tag{ background:var(--age-tint); color:var(--age-color); font-size:.66rem; }
  .pill.reqexp{ background:var(--brand-tint); color:var(--brand); border:1px solid #bcd0f2; font-size:.66rem; }
  .pill.conflict{
    background:var(--red-tint); color:var(--red); border:1px solid #f0b8b8; font-size:.66rem;
    display:none; align-items:center; gap:4px;
  }
  .pill.conflict.show{ display:inline-flex; }
  .pill.conflict svg{ width:11px; height:11px; stroke:currentColor; fill:none; stroke-width:2.2; }
  .pill.agewarn{
    background:var(--amber-tint); color:var(--amber); border:1px solid #e9d3a6; font-size:.66rem;
    display:none; align-items:center; gap:4px;
  }
  .pill.agewarn.show{ display:inline-flex; }
  .pill.agewarn svg{ width:11px; height:11px; stroke:currentColor; fill:none; stroke-width:2.2; }

  .event-sub{ font-size:.78rem; color:var(--ink-soft); display:block; line-height:1.5; }
  .event-sub b{ color:var(--ink); font-weight:700; }

  .expand-hint{
    display:flex; align-items:center; gap:5px; font-size:.76rem; font-weight:700; color:var(--brand);
    background:var(--brand-tint); border-radius:999px; padding:5px 12px;
    margin-inline-start:auto; align-self:center; white-space:nowrap; flex:0 0 auto; transition:background .16s ease;
  }
  .event-row:hover .expand-hint{ background:#dbe6fa; }
  .expand-hint svg{ width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2.6; transition:transform .26s ease; }
  .event-card.is-expanded .expand-hint svg{ transform:rotate(180deg); }

  .event-detail{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s cubic-bezier(.3,.8,.4,1); }
  .event-card.is-expanded .event-detail{ grid-template-rows:1fr; }
  .event-detail-inner{ overflow:hidden; min-width:0; }
  .event-detail-pad{ padding-block:2px 17px; padding-inline-start:134px; padding-inline-end:16px; }
  .event-card.is-expanded .event-detail-pad{ border-top:1px solid var(--card-line); padding-top:14px; }

  .detail-row{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:11px; }
  .detail-tag{ font-size:.84rem; font-weight:700; padding:4px 11px; border-radius:999px; background:var(--chip-tint); color:var(--ink-soft); border:1px solid var(--card-line); }
  .detail-tag.cat{ background:var(--cat-tint); color:var(--cat-color); border-color:transparent; font-size:.7rem; }
  .detail-tag.subcat{ background:var(--subcat-tint); color:var(--subcat-color); border-color:transparent; font-size:.7rem; }
  .detail-tag.age{ background:var(--age-tint); color:var(--age-color); border-color:transparent; font-size:.7rem; }
  .detail-tag.seats{ color:var(--seats-color); border-color:transparent; background:var(--seats-tint); font-size:.7rem; }
  .detail-tag.reqexp{ color:var(--brand); border-color:#bcd0f2; background:var(--brand-tint); }
  .detail-desc{ font-size:.95rem; line-height:1.7; color:var(--ink); display:block; padding-inline-start:12px; border-inline-start:3px solid var(--card-line-strong); }
  .detail-source{
    display:inline-flex; align-items:center; gap:6px; margin-top:13px; font-size:.82rem; font-weight:600;
    color:var(--brand); text-decoration:none; background:var(--brand-tint); padding:7px 13px; border-radius:999px;
    transition:background .16s ease, transform .14s ease;
  }
  .detail-source:hover{ background:#dbe6fa; transform:translateY(-1px); }
  .detail-source svg{ width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  .empty-note{
    text-align:center; color:var(--ink-soft); padding:48px 18px; font-size:1rem; line-height:1.7;
    background:#fff; border:1px dashed var(--card-line-strong); border-radius:var(--r-md);
  }
  .empty-note strong{ color:var(--ink); display:block; margin-bottom:6px; font-size:1.08rem; font-family:'Rubik',sans-serif; }

  /* ===== Participant badge ===== */
  .pbadge{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:7px; flex:0 0 auto;
    font-family:'Rubik',sans-serif; font-weight:700; font-size:.68rem; color:#fff;
    letter-spacing:.02em; user-select:none;
  }
  .pbadge.sm{ width:21px; height:21px; font-size:.6rem; border-radius:6px; }
  .pbadge.lg{ width:40px; height:40px; font-size:.95rem; border-radius:10px; }

  /* toggleable assignment chips inside mini-cards */
  .passign{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .pchip{
    min-width:23px; min-height:23px; border-radius:7px; cursor:pointer; padding:3px 4px;
    display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    font-family:'Rubik',sans-serif; font-weight:700; font-size:.62rem;
    border:1.5px solid transparent; transition:transform .12s ease, box-shadow .16s ease;
  }
  .pchip:hover{ transform:translateY(-1px) scale(1.05); box-shadow:var(--shadow-sm); }
  .pchip:active{ transform:scale(.95); }
  .pchip-initials{ line-height:1; }
  .pchip-status{
    font-size:.5rem; font-weight:700; color:#fff; border-radius:4px; padding:1px 6px; line-height:1.4; white-space:nowrap;
  }
  .pchip-status-dash{ background:#52525b; }
  .pchip-status-must{ background:#7f1d1d; }
  .pchip-status-maybe{ background:#8a6d1a; }
  .pchip-status-backup{ background:#5c3a21; }
  .pchip-status-reg{ background:#14532d; }

  /* status picker popup opened by clicking a participant chip */
  .pstatus-menu{
    position:fixed; z-index:400; background:#fff; border:1px solid var(--card-line-strong);
    border-radius:10px; box-shadow:var(--shadow-lg); padding:6px; display:flex; flex-direction:column; gap:2px;
    min-width:112px;
  }
  .pstatus-menu button{
    background:none; border:none; text-align:center; padding:7px 10px; border-radius:6px; cursor:pointer;
    font-family:'Assistant',sans-serif; font-size:.85rem; font-weight:700; color:var(--ink);
  }
  .pstatus-menu button:hover{ background:var(--chip-tint); }
  .pstatus-menu button[aria-current="true"]{ background:var(--brand-tint); color:var(--brand); }
  .pstatus-menu-sep{ height:1px; background:var(--card-line); margin:3px 2px; }
  .pstatus-menu .pstatus-remove{ color:var(--red); }
  .pstatus-menu .pstatus-remove:hover{ background:var(--red-tint); }

  /* ===== Conflict / banners ===== */
  .conflict-banner{
    display:none; align-items:flex-start; gap:11px; background:var(--red-tint);
    border:1px solid #f0b8b8; border-inline-start:4px solid var(--red);
    border-radius:var(--r-md); padding:13px 15px; margin-bottom:18px; box-shadow:var(--shadow-sm);
  }
  .conflict-banner.show{ display:flex; }
  .conflict-banner svg{ width:20px; height:20px; stroke:var(--red); fill:none; stroke-width:2; flex:0 0 auto; margin-top:1px; }
  .conflict-banner .cb-text{ font-size:.87rem; line-height:1.6; }
  .conflict-banner .cb-text b{ color:var(--red); }

  /* ===== Tab 2 ===== */
  .view-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .view-stats{ display:flex; gap:8px; flex-wrap:wrap; }
  .stat-chip{
    display:inline-flex; align-items:center; gap:7px; background:#fff; border:1px solid var(--card-line);
    border-radius:999px; padding:7px 14px; font-size:.82rem; font-weight:700; color:var(--ink); box-shadow:var(--shadow-xs);
  }
  .stat-chip .num{ font-family:'Rubik',sans-serif; color:var(--brand); font-size:.95rem; }
  .stat-chip.warn .num{ color:var(--red); }
  .btn-print{
    display:inline-flex; align-items:center; gap:7px; background:#fff; border:1px solid var(--card-line-strong);
    border-radius:999px; padding:8px 16px; font-family:'Assistant',sans-serif; font-size:.84rem; font-weight:700;
    color:var(--ink); cursor:pointer; box-shadow:var(--shadow-xs);
    transition:background .16s ease, transform .14s ease;
  }
  .btn-print:hover{ background:var(--chip-tint); transform:translateY(-1px); }
  .btn-print svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  .legend{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:#fff; border:1px solid var(--card-line); border-radius:var(--r-md);
    padding:12px 16px; margin-bottom:18px; box-shadow:var(--shadow-xs);
  }
  .legend-title{ font-family:'Rubik',sans-serif; font-weight:700; font-size:.85rem; color:var(--ink-soft); }
  .legend-item{ display:inline-flex; align-items:center; gap:7px; font-size:.85rem; font-weight:600; }
  .legend-item .age{ color:var(--ink-soft); font-size:.75rem; font-weight:600; }
  .legend-empty{ font-size:.85rem; color:var(--ink-soft); }
  .legend-empty a{ color:var(--brand); font-weight:700; cursor:pointer; text-decoration:underline; }

  .day-block{ margin-bottom:34px; }
  .day-title{ font-family:'Rubik',sans-serif; font-weight:700; font-size:1.18rem; color:var(--ink); margin:0 0 13px; display:flex; align-items:center; gap:10px; }
  .day-title .dot{ width:9px; height:9px; border-radius:50%; background:var(--brand); flex:0 0 auto; }
  .day-title .rule{ flex:1; height:2px; border-radius:2px; background:linear-gradient(to left, var(--card-line-strong), transparent); }
  .day-title .mini-count{ font-size:.74rem; font-weight:700; color:var(--brand); background:var(--brand-tint); border-radius:999px; padding:3px 10px; }

  .grid-scroll{ overflow-x:auto; border-radius:var(--r-md); border:1px solid var(--card-line-strong); box-shadow:var(--shadow-md); background:#fff; }
  table.slot-grid{ border-collapse:separate; border-spacing:0; width:100%; min-width:900px; background:#fff; }
  table.slot-grid th, table.slot-grid td{ border-bottom:1px solid var(--card-line); border-inline-start:1px solid var(--card-line); vertical-align:top; padding:10px; }
  table.slot-grid th:last-child, table.slot-grid td:last-child{ border-inline-end:none; }
  table.slot-grid tr:last-child th, table.slot-grid tr:last-child td{ border-bottom:none; }
  table.slot-grid thead th{
    background:var(--col-head-bg); font-family:'Rubik',sans-serif; font-weight:700; font-size:.86rem;
    color:#5c1f1f; padding:13px 10px; text-align:center; position:sticky; top:0; z-index:2; border-bottom:1px solid #e0aaaa;
  }
  table.slot-grid thead th:first-child{ background:var(--col-head-bg); border-inline-start:none; }
  table.slot-grid .row-label{
    background:#0f0f13; font-family:'Rubik',sans-serif; font-weight:600; font-size:.88rem;
    color:#fff; text-align:center; width:132px; border-inline-start:none; vertical-align:middle; line-height:1.5;
  }
  table.slot-grid td.slot-cell{ min-width:210px; background:#fbfcfe; }
  table.slot-grid td.slot-cell.has-items{ background:#fff; }
  .cell-empty{ color:#c8cfda; font-size:1.2rem; text-align:center; padding:8px 0; user-select:none; }

  .mini-card{
    background:#fff; border:1px solid var(--card-line); border-inline-start:4px solid var(--brand);
    border-radius:10px; padding:10px 12px; margin-bottom:8px; box-shadow:var(--shadow-xs);
    transition:box-shadow .18s ease;
  }
  .mini-card:hover{ box-shadow:var(--shadow-sm); }

  /* per-participant tab: several events in the same day/slot sit side by side, ranked by priority
     (first in DOM = rightmost in RTL = highest priority) */
  .participant-row{ display:flex; flex-direction:row; gap:10px; overflow-x:auto; padding-bottom:2px; }
  .participant-row .mini-card{ flex:0 0 auto; width:230px; margin-bottom:0; }
  .mini-card:last-child{ margin-bottom:0; }
  .mini-card.is-conflict{ border-inline-start-color:var(--red); background:#fffafa; }
  .mini-card .mc-time{ display:inline-flex; align-items:center; gap:5px; font-weight:600; font-family:'Rubik',sans-serif; font-size:.86rem; color:var(--ink); }
  .mini-card .mc-time svg{ width:12px; height:12px; stroke:var(--ink-soft); fill:none; stroke-width:2; }
  .mini-card .mc-name{ font-family:'Rubik',sans-serif; font-weight:600; color:var(--ink); font-size:.96rem; display:block; margin:6px 0 7px; line-height:1.45; }
  .mini-card .mc-sub{ color:var(--ink-soft); font-size:.72rem; display:block; margin-top:5px; line-height:1.5; }
  .mini-card .mc-cat{ display:inline-block; font-size:.64rem; font-weight:700; color:var(--cat-color); background:var(--cat-tint); padding:3px 10px; border-radius:999px; }
  .mini-card .mc-subcat{ display:inline-block; font-size:.64rem; font-weight:700; color:var(--subcat-color); background:var(--subcat-tint); padding:2px 9px; border-radius:999px; margin-inline-start:4px; }
  .mc-flags{ display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; align-items:center; }
  .mc-conflict{
    display:inline-flex; align-items:center; gap:5px; font-size:.62rem; font-weight:700; color:var(--red);
    background:var(--red-tint); border:1px solid #f0b8b8; padding:2px 8px; border-radius:999px;
  }
  .mc-conflict svg{ width:10px; height:10px; stroke:currentColor; fill:none; stroke-width:2.2; }
  .mc-conflict .pbadge{ width:15px; height:15px; font-size:.5rem; border-radius:4px; }
  .mc-agewarn{
    display:inline-flex; align-items:center; gap:5px; font-size:.62rem; font-weight:700; color:var(--amber);
    background:var(--amber-tint); border:1px solid #e9d3a6; padding:2px 8px; border-radius:999px;
  }
  .mc-agewarn svg{ width:10px; height:10px; stroke:currentColor; fill:none; stroke-width:2.2; }
  .mc-agewarn .pbadge{ width:15px; height:15px; font-size:.5rem; border-radius:4px; }

  /* ===== Tab 3: participants ===== */
  .part-intro{ font-size:.92rem; line-height:1.7; color:var(--ink-soft); margin-bottom:18px; max-width:760px; }
  .part-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px; }
  .part-card{
    background:#fff; border:1px solid var(--card-line); border-radius:var(--r-md);
    padding:15px; box-shadow:var(--shadow-sm); display:flex; gap:13px; align-items:flex-start;
    transition:border-color .18s ease, box-shadow .2s ease;
  }
  .part-card.filled{ border-color:var(--card-line-strong); }
  .part-fields{ flex:1; min-width:0; display:flex; flex-direction:column; gap:9px; }
  .part-field{ display:flex; flex-direction:column; gap:4px; }
  .part-field label{ font-size:.72rem; font-weight:700; color:var(--ink-soft); }
  .part-field input{
    font-family:'Assistant',sans-serif; font-size:.92rem; color:var(--ink);
    border:1px solid var(--card-line-strong); border-radius:var(--r-sm); padding:8px 11px; outline:none; background:#fff;
    transition:border-color .16s ease, box-shadow .16s ease; width:100%;
  }
  .part-field input:focus{ border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-tint); }
  .part-row2{ display:flex; gap:9px; }
  .part-row2 .part-field:first-child{ flex:1; }
  .part-row2 .part-field:last-child{ width:96px; flex:0 0 auto; }
  .part-clear{
    background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:.76rem; font-weight:700;
    padding:0; align-self:flex-start; border-bottom:1px solid transparent;
  }
  .part-clear:hover{ color:var(--red); border-bottom-color:var(--red); }
  .part-empty-badge{ background:#e3e7ee !important; color:#9aa6bb !important; }

  footer.site-foot{ text-align:center; color:var(--ink-soft); font-size:.78rem; padding:22px 16px; line-height:1.7; }
  footer.site-foot a{ color:var(--brand); font-weight:600; }

  @media (max-width:680px){
    html{ font-size:17px; }
    h1.site-title{ font-size:1.12rem; }
    .toolbar{ padding:10px 12px; gap:10px; }
    .tab-btn{ padding:8px 12px; font-size:.84rem; }
    .file-actions{ margin-inline-start:0; }
    .date-heading{ top:62px; }
    .event-side{ width:96px; }
    .event-detail-pad{ padding-inline-start:112px; }
    .expand-hint span{ display:none; }
    .expand-hint{ padding:6px 9px; }
    select.mini-select{ flex:1 1 130px; max-width:none; }
  }

  @media print{
    body{ background:#fff; }
    .toolbar, .filter-bar, .filter-meta, header.site-head .eyebrow, .restore-banner, .storage-note,
    #panel-mark, #panel-parts, #panel-filtered, .btn-print, .toast-wrap, footer.site-foot{ display:none !important; }
    .grid-scroll{ box-shadow:none; border-color:#999; overflow:visible; }
    table.slot-grid{ min-width:0; }
    .day-block{ break-inside:avoid; page-break-inside:avoid; }
    .mini-card{ box-shadow:none; }
    .pchip[data-on="0"]{ display:none !important; }
    .mc-deselect-btn{ display:none !important; }
    .pstatus-menu{ display:none !important; }
    .participant-row{ overflow-x:visible; flex-wrap:wrap; }
  }

  [hidden]{ display:none !important; }
  input[type="file"].visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<header class="site-head">
  <div class="head-row">
    <svg class="flourish" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.6 2 1.8 3.4 3.6 4.2-1.8.5-3 1.7-3.6 3.6-.6-1.9-1.8-3.1-3.6-3.6C10.2 5.4 11.4 4 12 2zm7 8c.4 1.3 1.2 2.2 2.4 2.7-1.2.4-2 1.3-2.4 2.6-.4-1.3-1.2-2.2-2.4-2.6 1.2-.5 2-1.4 2.4-2.7zM5 10c.4 1.3 1.2 2.2 2.4 2.7-1.2.4-2 1.3-2.4 2.6-.4-1.3-1.2-2.2-2.4-2.6C3.8 12.2 4.6 11.3 5 10zm7 6.4c.9 2.6 2.6 4.4 5.2 5.2-2.6.8-4.3 2.5-5.2 5.1-.9-2.6-2.6-4.3-5.2-5.1 2.6-.8 4.3-2.6 5.2-5.2z" transform="translate(0,-2) scale(.9)"/></svg>
    <h1 class="site-title">דרקוניקון 2026 - תוכנייה לשיבוץ</h1>
  </div>
  <span class="eyebrow">23–24 August 2026</span>
</header>

<div class="toolbar">
  <div class="tabs" role="tablist">
    <button class="tab-btn" id="tab-mark" role="tab" aria-selected="true" type="button">סימון אירועים</button>
    <button class="tab-btn" id="tab-view" role="tab" aria-selected="false" type="button">תצוגת נבחרים<span class="tab-badge" id="sel-count">0</span></button>
    <button class="tab-btn" id="tab-parts" role="tab" aria-selected="false" type="button">משתתפים<span class="tab-badge" id="part-count">0</span></button>
    <button class="tab-btn" id="tab-filtered" role="tab" aria-selected="false" type="button">אירועים מסוננים<span class="tab-badge" id="filtered-count">0</span></button>
    <span id="tabs-dynamic" style="display:contents"></span>
  </div>
  <div class="file-actions">
    <span class="save-dot" id="save-dot" title="יש שינויים שלא נשמרו לקובץ"></span>
    <button class="sq-btn" id="btn-save" type="button" aria-label="שמור לקובץ">
      <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5V4z"/><path d="M8 4v5h8V4"/><path d="M8 20v-6h8v6"/></svg>
      <span class="tip">שמור לקובץ</span>
    </button>
    <button class="sq-btn" id="btn-load" type="button" aria-label="טען מקובץ">
      <svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7z"/><path d="M12 11v6M9.5 13.5 12 11l2.5 2.5"/></svg>
      <span class="tip">טען מקובץ</span>
    </button>
    <input type="file" id="file-input" class="visually-hidden" accept=".drkc,text/plain">
    <span class="fa-sep" aria-hidden="true"></span>
    <button class="sq-btn" id="btn-drive-save" type="button" aria-label="שמור לגוגל דרייב">
      <svg viewBox="0 0 24 24"><path d="M7 17a4 4 0 0 1-1-7.9 5 5 0 0 1 9.6-2A4.5 4.5 0 0 1 17 17H7z"/><path d="M12 12v6M9.5 15.5 12 13l2.5 2.5"/></svg>
      <span class="tip">שמור לגוגל דרייב</span>
    </button>
    <button class="sq-btn" id="btn-drive-load" type="button" aria-label="טען מגוגל דרייב">
      <svg viewBox="0 0 24 24"><path d="M7 17a4 4 0 0 1-1-7.9 5 5 0 0 1 9.6-2A4.5 4.5 0 0 1 17 17H7z"/><path d="M12 12.5v6M9.5 16 12 18.5 14.5 16"/></svg>
      <span class="tip">טען מגוגל דרייב</span>
    </button>
  </div>
  <button class="collapse-btn" id="btn-collapse-toolbar" type="button" aria-expanded="true">
    <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
    <span id="collapse-btn-label">צמצם</span>
  </button>
</div>

<div class="drive-modal-backdrop" id="drive-modal-backdrop">
  <div class="drive-modal">
    <h3>איזה קובץ לטעון מגוגל דרייב?</h3>
    <div id="drive-modal-list"></div>
    <button class="drive-modal-cancel" id="drive-modal-cancel" type="button">ביטול</button>
  </div>
</div>

<div class="pstatus-menu" id="pstatus-menu" hidden>
  <button type="button" data-status="dash">---</button>
  <button type="button" data-status="must">חובה</button>
  <button type="button" data-status="maybe">אולי</button>
  <button type="button" data-status="backup">גיבוי</button>
  <button type="button" data-status="reg">רשום</button>
  <div class="pstatus-menu-sep"></div>
  <button type="button" data-status="remove" class="pstatus-remove">הסר</button>
</div>

<main>
  <div class="restore-banner" id="restore-banner">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    <div class="rb-text" id="restore-text"></div>
    <button class="btn-mini primary" id="restore-yes" type="button">שחזר</button>
    <button class="btn-mini" id="restore-no" type="button">התעלם</button>
  </div>
  <div class="storage-note" id="storage-note"></div>

  <section id="panel-mark">
    <div class="filter-bar">
      <div class="search-box" id="search-wrap">

<script>
(function(){
  "use strict";

  const EVENTS = JSON.parse(document.getElementById('events-data').textContent);
  const EVENTS_BY_ID = new Map(EVENTS.map(e => [e.id, e]));

  const CATS = ["הרצאה / סדנא","טורניר משחקי שולחן / קלפים","מיניאטורות","משחק שולחן / קלפים","משחק תפקידים חי","משחק תפקידים שולחני"];
  const AGES = ["ללא הגבלה","בוגרים 13+","מבוגרים 18+","ילדים 8-12"];
  const DAYS = ["23 אוגוסט","24 אוגוסט"];
  const DATE_LABEL = { "23 אוגוסט":"23 באוגוסט (יום א׳)", "24 אוגוסט":"24 באוגוסט (יום ב׳)" };
  const MAX_PARTS = 6;
  const PART_COLORS = ['#2b5fc7','#c1272d','#1e8a4c','#7b3fa0','#d97706','#0e7490'];
  const PSTATUS_LABEL = { dash:'---', must:'חובה', maybe:'אולי', backup:'גיבוי', reg:'רשום' };
  const PSTATUS_COLOR = { dash:'#52525b', must:'#7f1d1d', maybe:'#8a6d1a', backup:'#5c3a21', reg:'#14532d' };
  const PSTATUS_RANK  = { reg:0, must:1, maybe:2, backup:3, dash:4 };
  const PSTATUS_ORDER = ['dash','must','maybe','backup','reg'];
  const STORAGE_KEY = 'dragoncon2026.scheduler.v1';

  const ICON_CHECK='<svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L20 6.5"/></svg>';
  const ICON_CLOCK='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>';
  const ICON_CHEV='<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
  const ICON_WARN='<svg viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.2v.1"/></svg>';
  const ICON_LINK='<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4 10 14M9 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>';
  const ICON_TICK='<svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L20 6.5"/></svg>';
  const ICON_EYEOFF='<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M9.9 4.24A9.7 9.7 0 0 1 12 4c5 0 9 4 10 8-.3 1.1-.8 2.2-1.5 3.2M6.6 6.6C4.6 8 3.2 10 2.5 12c1 4 5 8 10 8 1 0 2-.2 3-.5"/></svg>';
  const ICON_UNDO='<svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg>';
  const ICON_X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  const toMin = t => { const p = t.split(':'); return (+p[0])*60 + (+p[1]); };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function pale(hex, amt){
    amt = amt === undefined ? 0.87 : amt;
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    const m=c=>Math.round(c+(255-c)*amt);
    return `rgb(${m(r)},${m(g)},${m(b)})`;
  }
  function initials(name){
    const parts = String(name).trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '';
    if (parts.length === 1) return parts[0].slice(0,2);
    return parts[0][0] + parts[parts.length-1][0];
  }
  /* minimum age implied by the event's age range; null = no minimum */
  function minAgeOf(ageRange){
    if (ageRange === 'בוגרים 13+') return 13;
    if (ageRange === 'מבוגרים 18+') return 18;
    if (ageRange === 'ילדים 8-12') return 8;
    return null;
  }
  function maxAgeOf(ageRange){ return ageRange === 'ילדים 8-12' ? 12 : null; }

  /* ============ STATE ============ */
  // participants: [{id, name, age, color}]
  // marks: { eventId: { parts: { participantId: 'dash'|'must'|'maybe'|'backup'|'reg' } } }  (presence in marks == selected; presence in parts == that participant is designated for it)
  // filtered: { eventId: true }  (presence == hidden from "סימון אירועים", shown only in "אירועים מסוננים")
  const state = { participants: [], marks: {}, filtered: {} };
  let dirty = false;

  function isSelected(id){ return Object.prototype.hasOwnProperty.call(state.marks, id); }
  function isFiltered(id){ return Object.prototype.hasOwnProperty.call(state.filtered, id); }
  function filteredCount(){ return Object.keys(state.filtered).length; }
  function markOf(id){ return state.marks[id]; }
  function selectedIds(){ return Object.keys(state.marks); }
  function selectedEvents(){ return selectedIds().map(id => EVENTS_BY_ID.get(id)).filter(Boolean); }
  function activeParts(){ return state.participants.filter(p => p.name.trim() !== ''); }
  function partById(id){ return state.participants.find(p => p.id === id); }

  /* conflicts are PER PARTICIPANT: same person assigned (any status) to two overlapping events */
  let conflictMap = new Map();   // eventId -> Set(participantId)
  function recomputeConflicts(){
    conflictMap = new Map();
    activeParts().forEach(p => {
      const evs = selectedIds()
        .filter(id => {
          const status = state.marks[id].parts[p.id];
          return status === 'reg' || status === 'must';
        })
        .map(id => EVENTS_BY_ID.get(id))
        .filter(Boolean);
      for (let i=0;i<evs.length;i++){
        for (let j=i+1;j<evs.length;j++){
          const a=evs[i], b=evs[j];
          if (a.date !== b.date) continue;
          if (toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end)){
            if (!conflictMap.has(a.id)) conflictMap.set(a.id, new Set());
            if (!conflictMap.has(b.id)) conflictMap.set(b.id, new Set());
            conflictMap.get(a.id).add(p.id);
            conflictMap.get(b.id).add(p.id);
          }
        }
      }
    });
  }
  /* age mismatches: assigned participant outside the event's age range */
  function ageIssues(eventId){
    const ev = EVENTS_BY_ID.get(eventId);
    const m = state.marks[eventId];
    if (!ev || !m) return [];
    const lo = minAgeOf(ev.age), hi = maxAgeOf(ev.age);
    return Object.keys(m.parts).map(pid=>partById(Number(pid))).filter(p => {
      if (!p || p.age === '' || p.age === null || isNaN(p.age)) return false;
      if (lo !== null && p.age < lo) return true;
      if (hi !== null && p.age > hi) return true;
      return false;
    });
  }

  /* ============ STORAGE ============ */
  let storageOK = true;
  (function testStorage(){
    try{
      const k='__t'+Date.now(); localStorage.setItem(k,'1'); localStorage.removeItem(k);
    }catch(e){ storageOK=false; }
  })();

  let saveTimer=null;
  function autosave(){
    if (!storageOK) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          savedAt: new Date().toISOString(),
          participants: state.participants,
          marks: state.marks,
          filtered: state.filtered
        }));
      }catch(e){
        storageOK=false;
        showStorageNote('הגיבוי האוטומטי הפסיק לעבוד (ייתכן שנגמר מקום האחסון בדפדפן). הקפידו לשמור לקובץ .drkc.');
      }
    }, 400);
  }
  function readBackup(){
    if (!storageOK) return null;
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || (!d.marks && !d.participants && !d.filtered)) return null;
      const n = d.marks ? Object.keys(d.marks).length : 0;
      const np = (d.participants||[]).filter(p=>p.name && p.name.trim()).length;
      const nf = d.filtered ? Object.keys(d.filtered).length : 0;
      if (!n && !np && !nf) return null;
      return d;
    }catch(e){ return null; }
  }
  function showStorageNote(msg){
    const el = document.getElementById('storage-note');
    el.textContent = msg; el.classList.add('show');
  }

  function setDirty(v){
    dirty = v;
    document.getElementById('save-dot').classList.toggle('show', v);
  }
  window.addEventListener('beforeunload', (e) => {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = '';
    return '';
  });

  /* ============ BUILD TAB 1 ============ */
  const catSelect=document.getElementById('cat-select');
  CATS.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; catSelect.appendChild(o); });
  const ageSelect=document.getElementById('age-select');
  AGES.forEach(a=>{ const o=document.createElement('option'); o.value=a; o.textContent=a; ageSelect.appendChild(o); });

  const listContainer = document.getElementById('event-list-container');

  function buildDetailTags(ev){
    const dTags=[];
    dTags.push(`<span class="detail-tag cat">${esc(ev.category)}</span>`);
    dTags.push(`<span class="detail-tag age">${esc(ev.age)}</span>`);
    if (ev.subcat) dTags.push(`<span class="detail-tag subcat">${esc(ev.subcat)}</span>`);
    if (ev.reqExp) dTags.push(`<span class="detail-tag reqexp">נדרש ניסיון בשיטה</span>`);
    if (ev.seats)  dTags.push(`<span class="detail-tag seats">${esc(ev.seats)}</span>`);
    return dTags;
  }

  function buildEventCard(ev){
    const card=document.createElement('div');
    card.className='event-card';
    card.dataset.id=ev.id;
    card.dataset.name=ev.name.toLowerCase();
    card.dataset.host=ev.host.toLowerCase();
    card.dataset.cat=ev.category;
    card.dataset.age=ev.age;
    card.dataset.date=ev.date;
    card.dataset.start=ev.start;

    const dTags=buildDetailTags(ev);

    card.innerHTML = `
      <div class="event-row">
        <div class="event-side">
          <span class="seal-wrap">
            <span class="seal">
              <input type="checkbox" data-id="${ev.id}" aria-label="סמן השתתפות באירוע ${esc(ev.name)}">
              ${ICON_CHECK}
            </span>
          </span>
          <span class="side-date">${esc(ev.date)}</span>
          <span class="side-time">${ev.start}<span class="dash">–</span>${ev.end}</span>
          <button class="filter-btn" type="button" title="סנן אירוע זה (לא מתכננים להשתתף)">${ICON_EYEOFF}<span>סנן</span></button>
        </div>
        <div class="event-body">
          <div class="event-main">
            <div class="event-name">${esc(ev.name)}</div>
            <div class="event-tags-row">
              <span class="pill cat-tag">${esc(ev.category)}</span>
              ${ev.subcat ? `<span class="pill subcat-tag">${esc(ev.subcat)}</span>` : ''}
              <span class="pill age-tag">${esc(ev.age)}</span>
              ${ev.reqExp ? '<span class="pill reqexp">נדרש ניסיון בשיטה</span>' : ''}
              <span class="pill conflict" data-role="conflict">${ICON_WARN}חפיפה</span>
              <span class="pill agewarn" data-role="agewarn">${ICON_WARN}גיל</span>
            </div>
            <div class="event-sub">מנחה: <b>${esc(ev.host)}</b></div>
          </div>
          <span class="expand-hint"><span>פרטים</span>${ICON_CHEV}</span>
        </div>
      </div>
      <div class="event-detail"><div class="event-detail-inner"><div class="event-detail-pad">
        <div class="detail-row">${dTags.join('')}</div>
        <div class="detail-desc">${esc(ev.desc||'')}</div>
        <a class="detail-source" href="${ev.url}" target="_blank" rel="noopener">${ICON_LINK}לתיאור המלא והמדויק ולהרשמה בעמוד האירוע</a>
      </div></div></div>`;
    return card;
  }

  const dayCountEls={};
  (function renderList(){
    let cur=null, listEl=null;
    EVENTS.forEach(ev=>{
      if (ev.date!==cur){
        cur=ev.date;
        const h=document.createElement('div');
        h.className='date-heading';
        h.innerHTML=`<span class="banner"><span class="dot"></span>${DATE_LABEL[ev.date]}<span class="day-count" data-day-count="${ev.date}" hidden></span></span><span class="rule"></span>`;
        listContainer.appendChild(h);
        listEl=document.createElement('div'); listEl.className='event-list';
        listContainer.appendChild(listEl);
      }
      listEl.appendChild(buildEventCard(ev));
    });
    DAYS.forEach(d=>{ dayCountEls[d]=listContainer.querySelector(`[data-day-count="${d}"]`); });
    const note=document.createElement('div');
    note.id='no-results-note'; note.className='empty-note'; note.hidden=true;
    note.innerHTML='<strong>לא נמצאו אירועים</strong>נסו לשנות את מילות החיפוש או לאפס את הסינון.';
    listContainer.appendChild(note);
  })();

  const cardById = new Map([...listContainer.querySelectorAll('.event-card')].map(c=>[c.dataset.id,c]));

  /* ---- sync one card's UI from state ---- */
  function syncCard(id){
    const card=cardById.get(id); if(!card) return;
    const sel=isSelected(id);
    card.classList.toggle('is-checked', sel);
    const cb=card.querySelector('input[type=checkbox]');
    cb.checked=sel;
    card.querySelector('.seal').classList.toggle('checked', sel);

    const cSet=conflictMap.get(id);
    const hasC=sel && cSet && cSet.size>0;
    card.classList.toggle('is-conflict', !!hasC);
    const cPill=card.querySelector('[data-role="conflict"]');
    cPill.classList.toggle('show', !!hasC);
    if (hasC){
      cPill.innerHTML = ICON_WARN + 'חפיפה' +
        [...cSet].map(pid=>{ const p=partById(pid); return p?badgeHTML(p,'sm'):''; }).join('');
    }
    const issues = sel ? ageIssues(id) : [];
    const aPill=card.querySelector('[data-role="agewarn"]');
    aPill.classList.toggle('show', issues.length>0);
    if (issues.length){
      aPill.innerHTML = ICON_WARN + 'גיל' + issues.map(p=>badgeHTML(p,'sm')).join('');
    }
  }
  function syncAllCards(){ cardById.forEach((_,id)=>syncCard(id)); }

  function badgeHTML(p, size){
    const cls = size==='sm' ? 'pbadge sm' : size==='lg' ? 'pbadge lg' : 'pbadge';
    return `<span class="${cls}" style="background:${p.color}" title="${esc(p.name)}">${esc(initials(p.name))}</span>`;
  }

  /* ---- selection handler ---- */
  listContainer.addEventListener('change', e=>{
    if (!e.target.matches('input[type=checkbox]')) return;
    const id=e.target.dataset.id;
    if (e.target.checked) state.marks[id]={parts:{}};
    else delete state.marks[id];
    afterStateChange();
  });
  listContainer.addEventListener('click', e=>{
    const fb=e.target.closest('.filter-btn');
    if (fb){
      const id=fb.closest('.event-card').dataset.id;
      if (isSelected(id)) return; // safety net: button is hidden in this case anyway
      state.filtered[id]=true;
      afterStateChange();
      toast('האירוע הוסתר מרשימת הסימון. אפשר לשחזר אותו בטאב "אירועים מסוננים".');
      return;
    }
    if (e.target.closest('.seal-wrap')) return;
    if (e.target.closest('.detail-source')) return;
    const row=e.target.closest('.event-row'), det=e.target.closest('.event-detail');
    if (!row && !det) return;
    const card=(row||det).closest('.event-card');
    if (!card) return;
    if (det && !card.classList.contains('is-expanded')) return;
    if (expanded && expanded!==card) expanded.classList.remove('is-expanded');
    const now=!card.classList.contains('is-expanded');
    card.classList.toggle('is-expanded', now);
    expanded = now?card:null;
  });
  let expanded=null;

  /* ============ shared state refresh ============ */
  function afterStateChange(opts){
    opts=opts||{};
    recomputeConflicts();
    syncAllCards();
    updateCounters();
    applyFilters();
    renderParticipantTabs();
    if (!panelView.hidden) renderView();
    if (!panelParts.hidden && opts.rerenderParts) renderParts();
    if (!panelFiltered.hidden) renderFiltered();
    if (!panelParticipant.hidden && currentParticipantTabId!=null) renderParticipantView(currentParticipantTabId);
    if (opts.markDirty!==false){ setDirty(true); autosave(); }
  }

  function updateCounters(){
    const n=selectedIds().length;
    document.getElementById('sel-count').textContent=n;
    document.getElementById('part-count').textContent=activeParts().length;
    document.getElementById('filtered-count').textContent=filteredCount();
    document.getElementById('clear-all').hidden = n===0;
    DAYS.forEach(d=>{
      const c=selectedEvents().filter(e=>e.date===d).length;
      const el=dayCountEls[d];
      if(el){ el.textContent=c+' נבחרו'; el.hidden=c===0; }
    });
  }

  /* ============ FILTERS ============ */
  const searchInput=document.getElementById('search-input');
  const searchWrap=document.getElementById('search-wrap');
  const datePills=document.querySelectorAll('#date-pills .pill-toggle');
  const timePills=document.querySelectorAll('#time-pills .pill-toggle');
  const onlySelBtn=document.getElementById('only-selected');
  const noConfBtn=document.getElementById('no-conflicts');
  const resultCount=document.getElementById('result-count');
  const resetBtn=document.getElementById('reset-filters');
  let activeDate='all', activeTime='all', onlySelected=false, noConflicts=false;

  function timeBucket(start){
    if (start < '13:30') return 'morning';
    if (start < '18:00') return 'afternoon';
    return 'evening';
  }

  datePills.forEach(b=>b.addEventListener('click',()=>{
    datePills.forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true'); activeDate=b.dataset.date; applyFilters();
  }));
  timePills.forEach(b=>b.addEventListener('click',()=>{
    timePills.forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true'); activeTime=b.dataset.time; applyFilters();
  }));
  onlySelBtn.addEventListener('click',()=>{ onlySelected=!onlySelected; onlySelBtn.setAttribute('aria-pressed',String(onlySelected)); applyFilters(); });
  noConfBtn.addEventListener('click',()=>{ noConflicts=!noConflicts; noConfBtn.setAttribute('aria-pressed',String(noConflicts)); applyFilters(); });
  catSelect.addEventListener('change',applyFilters);
  ageSelect.addEventListener('change',applyFilters);
  searchInput.addEventListener('input',applyFilters);
  document.getElementById('clear-search').addEventListener('click',()=>{ searchInput.value=''; searchInput.focus(); applyFilters(); });
  resetBtn.addEventListener('click',()=>{
    searchInput.value=''; activeDate='all'; activeTime='all';
    datePills.forEach(b=>b.setAttribute('aria-pressed', b.dataset.date==='all'?'true':'false'));
    timePills.forEach(b=>b.setAttribute('aria-pressed', b.dataset.time==='all'?'true':'false'));
    catSelect.value='all'; ageSelect.value='all';
    onlySelected=false; onlySelBtn.setAttribute('aria-pressed','false');
    noConflicts=false; noConfBtn.setAttribute('aria-pressed','false');
    applyFilters();
  });

  function getFilterState(){
    return {
      search: searchInput.value,
      date: activeDate,
      time: activeTime,
      cat: catSelect.value,
      age: ageSelect.value,
      onlySelected: onlySelected,
      noConflicts: noConflicts
    };
  }

  function applyFilterState(f){
    if (!f) return;
    searchInput.value = f.search || '';
    activeDate = (f.date==='23 אוגוסט' || f.date==='24 אוגוסט') ? f.date : 'all';
    datePills.forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.date===activeDate)));
    activeTime = ['morning','afternoon','evening'].includes(f.time) ? f.time : 'all';
    timePills.forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.time===activeTime)));
    const catOk = [...catSelect.options].some(o=>o.value===f.cat);
    catSelect.value = catOk ? f.cat : 'all';
    const ageOk = [...ageSelect.options].some(o=>o.value===f.age);
    ageSelect.value = ageOk ? f.age : 'all';
    onlySelected = !!f.onlySelected;
    onlySelBtn.setAttribute('aria-pressed', String(onlySelected));
    noConflicts = !!f.noConflicts;
    noConfBtn.setAttribute('aria-pressed', String(noConflicts));
    applyFilters();
  }

  function applyFilters(){
    const q=searchInput.value.trim().toLowerCase();
    const cat=catSelect.value, age=ageSelect.value;
    searchWrap.classList.toggle('has-value', q.length>0);
    let visible=0;
    cardById.forEach((card,id)=>{
      let show=true;
      if (isFiltered(id)) show=false;
      if (activeDate!=='all' && card.dataset.date!==activeDate) show=false;
      if (activeTime!=='all' && timeBucket(card.dataset.start)!==activeTime) show=false;
      if (cat!=='all' && card.dataset.cat!==cat) show=false;
      if (age!=='all' && card.dataset.age!==age) show=false;
      if (q && !(card.dataset.name.includes(q)||card.dataset.host.includes(q))) show=false;
      if (onlySelected && !isSelected(id)) show=false;
      if (noConflicts && conflictMap.has(id)) show=false;
      card.classList.toggle('is-hidden', !show);
      if (show) visible++;
    });
    listContainer.querySelectorAll('.date-heading').forEach(h=>{
      const l=h.nextElementSibling;
      const any=l&&[...l.children].some(c=>!c.classList.contains('is-hidden'));
      h.hidden=!any; if(l) l.hidden=!any;
    });
    document.getElementById('no-results-note').hidden = visible!==0;
    const active = q||activeDate!=='all'||activeTime!=='all'||cat!=='all'||age!=='all'||onlySelected||noConflicts;
    resetBtn.hidden=!active;
    const fN=filteredCount(), totalCount=EVENTS.length-fN;
    const filteredNote = fN ? ` <span class="filtered-note">(${fN} מסוננים, לא מוצגים כאן)</span>` : '';
    resultCount.innerHTML = (active
      ? `מוצגים <b>${visible}</b> מתוך <b>${totalCount}</b> אירועים`
      : `<b>${totalCount}</b> אירועים בתוכנייה`) + filteredNote;
  }

  document.getElementById('clear-all').addEventListener('click',()=>{
    const n=selectedIds().length; if(!n) return;
    if(!window.confirm('לנקות את כל '+n+' הסימונים? (המשתתפים יישארו)')) return;
    state.marks={};
    afterStateChange();
    toast('כל הסימונים נוקו.');
  });

  /* ============ TABS ============ */
  const tabMark=document.getElementById('tab-mark'), tabView=document.getElementById('tab-view'), tabParts=document.getElementById('tab-parts'), tabFiltered=document.getElementById('tab-filtered');
  const panelMark=document.getElementById('panel-mark'), panelView=document.getElementById('panel-view'), panelParts=document.getElementById('panel-parts'), panelFiltered=document.getElementById('panel-filtered');
  const panelParticipant=document.getElementById('panel-participant');
  const tabsDynamic=document.getElementById('tabs-dynamic');
  let currentParticipantTabId=null;

  tabMark.addEventListener('click',()=>switchTab('mark'));
  tabView.addEventListener('click',()=>switchTab('view'));
  tabParts.addEventListener('click',()=>switchTab('parts'));
  tabFiltered.addEventListener('click',()=>switchTab('filtered'));
  tabsDynamic.addEventListener('click', e=>{
    const btn=e.target.closest('[data-participant-tab]'); if(!btn) return;
    switchTab('participant:'+btn.dataset.participantTab);
  });

  function switchTab(w){
    const isP = typeof w==='string' && w.indexOf('participant:')===0;
    currentParticipantTabId = isP ? Number(w.slice('participant:'.length)) : null;

    tabMark.setAttribute('aria-selected',String(w==='mark'));
    tabView.setAttribute('aria-selected',String(w==='view'));
    tabParts.setAttribute('aria-selected',String(w==='parts'));
    tabFiltered.setAttribute('aria-selected',String(w==='filtered'));
    tabsDynamic.querySelectorAll('[data-participant-tab]').forEach(b=>{
      b.setAttribute('aria-selected', String(isP && Number(b.dataset.participantTab)===currentParticipantTabId));
    });

    panelMark.hidden=w!=='mark'; panelView.hidden=w!=='view'; panelParts.hidden=w!=='parts'; panelFiltered.hidden=w!=='filtered';
    panelParticipant.hidden=!isP;

    if(w==='view') renderView();
    if(w==='parts') renderParts();
    if(w==='filtered') renderFiltered();
    if(isP) renderParticipantView(currentParticipantTabId);
  }
  window.__switchTab = switchTab;

  function renderParticipantTabs(){
    tabsDynamic.innerHTML = activeParts().map(p=>{
      const n = selectedIds().filter(id=>Object.prototype.hasOwnProperty.call(state.marks[id].parts, p.id)).length;
      const active = currentParticipantTabId===p.id;
      return `<button class="tab-btn" data-participant-tab="${p.id}" role="tab" aria-selected="${active}" type="button">${esc(p.name)}<span class="tab-badge">${n}</span></button>`;
    }).join('');
    if (currentParticipantTabId!=null){
      const p=partById(currentParticipantTabId);
      if (!p || p.name.trim()==='') switchTab('view');
    }
  }

  /* ============ TAB 2 ============ */
  const ROW_DEFS=[
    {label:'בוקר (עד 13:30)',      test:t=>t<'13:30'},
    {label:'צהריים (13:30-18:00)', test:t=>t>='13:30'&&t<'18:00'},
    {label:'ערב (18:00 והלאה)',    test:t=>t>='18:00'}
  ];

  function miniCardHTML(ev){
    const m=markOf(ev.id);
    const cSet=conflictMap.get(ev.id);
    const isC=cSet&&cSet.size>0;
    const issues=ageIssues(ev.id);
    const parts=activeParts();

    const chips = parts.map(p=>{
      const status=m.parts[p.id]; // undefined = not designated for this event
      const on=status!==undefined;
      const bg = on ? p.color : pale(p.color);
      const fg = on ? '#fff' : pale(p.color,0.45);
      const bd = on ? p.color : pale(p.color,0.7);
      return `<button class="pchip" type="button" data-ev="${ev.id}" data-pid="${p.id}" data-on="${on?1:0}"
        title="${esc(p.name)}${on?' — '+PSTATUS_LABEL[status]:''}"
        style="background:${bg};color:${fg};border-color:${bd}">
        <span class="pchip-initials">${esc(initials(p.name))}</span>
        ${on?`<span class="pchip-status pchip-status-${status}">${PSTATUS_LABEL[status]}</span>`:''}
      </button>`;
    }).join('');

    const flags=[];
    if (isC)    flags.push(`<span class="mc-conflict">${ICON_WARN}חפיפה${[...cSet].map(pid=>{const p=partById(pid);return p?badgeHTML(p,'sm'):'';}).join('')}</span>`);
    if (issues.length) flags.push(`<span class="mc-agewarn">${ICON_WARN}גיל${issues.map(p=>badgeHTML(p,'sm')).join('')}</span>`);

    return `<div class="mini-card${isC?' is-conflict':''}">
      <div class="mc-toprow">
        <span class="mc-time">${ICON_CLOCK}${ev.start}–${ev.end}</span>
        <button class="mc-deselect-btn" type="button" data-ev="${ev.id}" title="בטל את הסימון של האירוע הזה">${ICON_X}<span>בטל בחירה</span></button>
      </div>
      <span class="mc-name">${esc(ev.name)}</span>
      <span class="mc-cat">${esc(ev.category)}</span>${ev.subcat?`<span class="mc-subcat">${esc(ev.subcat)}</span>`:''}
      ${flags.length?`<div class="mc-flags">${flags.join('')}</div>`:''}
      <span class="mc-sub">מנחה: ${esc(ev.host)}</span>
      ${parts.length?`<div class="passign">${chips}</div>`:''}
    </div>`;
  }

  function buildDayTable(dateKey, evs){
    const rows=ROW_DEFS.map(rd=>{
      const cells=AGES.map(age=>{
        const ms=evs.filter(e=>e.age===age&&rd.test(e.start))
                    .sort((a,b)=>toMin(a.start)-toMin(b.start)||toMin(a.end)-toMin(b.end));
        return ms.length
          ? `<td class="slot-cell has-items">${ms.map(miniCardHTML).join('')}</td>`
          : `<td class="slot-cell"><div class="cell-empty">—</div></td>`;
      }).join('');
      return `<tr><th class="row-label">${rd.label}</th>${cells}</tr>`;
    }).join('');
    return `<div class="day-block">
      <h2 class="day-title"><span class="dot"></span>${DATE_LABEL[dateKey]}
        <span class="mini-count">${evs.length} אירועים</span><span class="rule"></span></h2>
      <div class="grid-scroll"><table class="slot-grid">
        <thead><tr><th></th>${AGES.map(a=>`<th>${a}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }

  function renderView(){
    const sel=selectedEvents();
    if (!sel.length){
      panelView.innerHTML=`<div class="empty-note"><strong>עדיין לא סימנתם אירועים</strong>
        עברו לטאב "סימון אירועים", לחצו על העיגול שליד כל אירוע שמעניין אתכם,<br>והתוכנייה המקוצרת שלכם תיבנה כאן אוטומטית.</div>`;
      return;
    }
    const parts=activeParts();
    const legend = parts.length
      ? `<div class="legend"><span class="legend-title">מקרא משתתפים:</span>${
          parts.map(p=>`<span class="legend-item">${badgeHTML(p)}${esc(p.name)}${p.age!==''&&p.age!==null&&!isNaN(p.age)?`<span class="age">(${p.age})</span>`:''}</span>`).join('')
        }</div>`
      : `<div class="legend"><span class="legend-title">מקרא משתתפים:</span>
          <span class="legend-empty">עדיין לא הוגדרו משתתפים — <a data-goto-parts>הוסיפו משתתפים</a> כדי לשבץ אותם לאירועים.</span></div>`;

    const nConfEvents=[...conflictMap.keys()].length;
    const confParts=new Set(); conflictMap.forEach(s=>s.forEach(x=>confParts.add(x)));
    const banner = nConfEvents ? `<div class="conflict-banner show">${ICON_WARN}
      <div class="cb-text"><b>יש חפיפות בזמנים.</b> ${nConfEvents} אירועים משובצים לאותו משתתף בזמנים חופפים${
        confParts.size?': '+[...confParts].map(pid=>{const p=partById(pid);return p?badgeHTML(p,'sm')+' '+esc(p.name):'';}).join(', '):''
      }. שימו לב לפני ההרשמה.</div></div>` : '';

    function countStatus(status){
      let n=0;
      selectedIds().forEach(id=>{
        const parts=state.marks[id].parts;
        Object.keys(parts).forEach(pid=>{ if (parts[pid]===status) n++; });
      });
      return n;
    }
    const nReg=countStatus('reg');
    const nMust=countStatus('must');

    panelView.innerHTML =
      `<div class="view-head">
        <div class="view-stats">
          <span class="stat-chip"><span class="num">${sel.length}</span> אירועים נבחרו</span>
          <span class="stat-chip"><span class="num">${sel.filter(e=>e.date===DAYS[0]).length}</span> ב-23 באוג׳</span>
          <span class="stat-chip"><span class="num">${sel.filter(e=>e.date===DAYS[1]).length}</span> ב-24 באוג׳</span>
          ${nMust?`<span class="stat-chip"><span class="num">${nMust}</span> חובה</span>`:''}
          ${nReg?`<span class="stat-chip"><span class="num">${nReg}</span> רשום</span>`:''}
          ${nConfEvents?`<span class="stat-chip warn"><span class="num">${nConfEvents}</span> בחפיפה</span>`:''}
        </div>
        <button class="btn-print" type="button">
          <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2"/><path d="M6 14h12v7H6z"/></svg>הדפסה
        </button>
      </div>` + legend + banner
      + buildDayTable(DAYS[0], sel.filter(e=>e.date===DAYS[0]))
      + buildDayTable(DAYS[1], sel.filter(e=>e.date===DAYS[1]));

    const pb=panelView.querySelector('.btn-print');
    if (pb) pb.addEventListener('click',()=>window.print());
    const goto=panelView.querySelector('[data-goto-parts]');
    if (goto) goto.addEventListener('click',()=>switchTab('parts'));
  }

  /* deselect / participant-status-menu opener — shared by tab 2 and per-participant tabs */
  function handleMiniCardClick(e){
    const deselectBtn=e.target.closest('.mc-deselect-btn');
    if (deselectBtn){
      const id=deselectBtn.dataset.ev;
      delete state.marks[id];
      afterStateChange();
      toast('הסימון בוטל. האירוע כבר לא מסומן כ"משתתף".');
      return;
    }
    const chip=e.target.closest('.pchip'); if(!chip) return;
    openPstatusMenu(chip, chip.dataset.ev, Number(chip.dataset.pid));
  }
  panelView.addEventListener('click', handleMiniCardClick);
  panelParticipant.addEventListener('click', handleMiniCardClick);

  /* ============ PARTICIPANT STATUS MENU ============ */
  const pstatusMenu = document.getElementById('pstatus-menu');
  let pstatusTarget = null; // {evId, pid}

  function closePstatusMenu(){
    pstatusMenu.hidden = true;
    pstatusTarget = null;
  }

  function openPstatusMenu(chipEl, evId, pid){
    const m = markOf(evId); if (!m) return;
    pstatusTarget = { evId, pid };
    const current = m.parts[pid];
    pstatusMenu.querySelectorAll('button[data-status]').forEach(b=>{
      b.setAttribute('aria-current', String(b.dataset.status===current));
    });
    pstatusMenu.hidden = false;
    const r = chipEl.getBoundingClientRect();
    const menuW = pstatusMenu.offsetWidth || 112, menuH = pstatusMenu.offsetHeight || 230;
    let left = r.left, top = r.bottom + 6;
    if (left + menuW > window.innerWidth - 8) left = window.innerWidth - menuW - 8;
    if (left < 8) left = 8;
    if (top + menuH > window.innerHeight - 8) top = r.top - menuH - 6;
    if (top < 8) top = 8;
    pstatusMenu.style.left = left+'px';
    pstatusMenu.style.top = top+'px';
  }

  pstatusMenu.addEventListener('click', e=>{
    const btn=e.target.closest('button[data-status]'); if(!btn || !pstatusTarget) return;
    const { evId, pid } = pstatusTarget;
    const m = markOf(evId);
    if (m){
      if (btn.dataset.status==='remove') delete m.parts[pid];
      else m.parts[pid] = btn.dataset.status;
    }
    closePstatusMenu();
    afterStateChange();
  });
  document.addEventListener('click', e=>{
    if (pstatusMenu.hidden) return;
    if (e.target.closest('#pstatus-menu') || e.target.closest('.pchip')) return;
    closePstatusMenu();
  });
  document.addEventListener('keydown', e=>{
    if (e.key==='Escape' && !pstatusMenu.hidden) closePstatusMenu();
  });

  /* ============ PER-PARTICIPANT TABS ============ */
  function buildParticipantDayTable(pid, dateKey, evs){
    const dayEvs = evs.filter(e=>e.date===dateKey);
    const rows = ROW_DEFS.map(rd=>{
      const cellEvs = dayEvs.filter(e=>rd.test(e.start)).sort((a,b)=>
        (PSTATUS_RANK[markOf(a.id).parts[pid]]??5)-(PSTATUS_RANK[markOf(b.id).parts[pid]]??5) || toMin(a.start)-toMin(b.start) || a.name.localeCompare(b.name,'he'));
      const cell = cellEvs.length
        ? `<td class="slot-cell has-items"><div class="participant-row">${cellEvs.map(miniCardHTML).join('')}</div></td>`
        : `<td class="slot-cell"><div class="cell-empty">—</div></td>`;

  /* ============ FILE SAVE / LOAD (.drkc) ============ */
  const FILE_TYPES=[{description:'קובץ בחירת אירועים - דרקוניקון', accept:{'text/plain':['.drkc']}}];
  const SUGGESTED_NAME='דרקוניקון2026-בחירה.drkc';

  function buildFileText(){
    const L=[];
    L.push('# דרקוניקון 2026 - תוכנייה נבחרת');
    L.push('# נשמר בתאריך: '+new Date().toLocaleString('he-IL'));
    L.push('# גרסת מבנה: 4');
    L.push('#');
    L.push('# ===== משתתפים =====');
    L.push('# פורמט: @מזהה | שם | גיל');
    const aps=activeParts();
    if(!aps.length) L.push('# (לא הוגדרו משתתפים)');
    else aps.forEach(p=>L.push(`@${p.id} | ${p.name} | ${p.age===''?'':p.age}`));
    L.push('#');
    L.push('# ===== אירועים =====');
    L.push('# פורמט: מזהה | תאריך | שעות | שיבוצים | שם האירוע | מנחה');
    L.push('# שיבוצים: מזהה_משתתף:מצב, מופרד בפסיקים (מצבים: dash=--- must=חובה maybe=אולי backup=גיבוי reg=רשום)');
    L.push('#');
    const sel=selectedEvents().sort((a,b)=>
      DAYS.indexOf(a.date)-DAYS.indexOf(b.date)||toMin(a.start)-toMin(b.start)||toMin(a.end)-toMin(b.end));
    if(!sel.length){ L.push('# (לא נבחרו אירועים)'); }
    else{
      let last=null;
      sel.forEach(ev=>{
        if(ev.date!==last){ if(last!==null) L.push(''); L.push('# --- '+DATE_LABEL[ev.date]+' ---'); last=ev.date; }
        const m=markOf(ev.id);
        const entries=Object.keys(m.parts);
        const assignStr = entries.length ? entries.map(pid=>`${pid}:${m.parts[pid]}`).join(',') : '-';
        L.push(`${ev.id} | ${ev.date} | ${ev.start}-${ev.end} | ${assignStr} | ${ev.name} | ${ev.host}`);
      });
    }
    L.push('#');
    L.push('# ===== מסוננים (אירועים שהוסתרו מרשימת הסימון) =====');
    L.push('# פורמט: !מזהה | שם האירוע (לנוחות קריאה בלבד)');
    const filt=Object.keys(state.filtered).map(id=>EVENTS_BY_ID.get(id)).filter(Boolean).sort((a,b)=>
      DAYS.indexOf(a.date)-DAYS.indexOf(b.date)||toMin(a.start)-toMin(b.start));
    if(!filt.length) L.push('# (אין אירועים מסוננים)');
    else filt.forEach(ev=>L.push(`!${ev.id} | ${ev.name}`));
    L.push('#');
    L.push('# ===== סינון (מצב הסינון בטאב "סימון אירועים") =====');
    L.push('# פורמט: %מפתח=ערך');
    const fst=getFilterState();
    L.push(`%search=${fst.search}`);
    L.push(`%date=${fst.date}`);
    L.push(`%time=${fst.time}`);
    L.push(`%cat=${fst.cat}`);
    L.push(`%age=${fst.age}`);
    L.push(`%onlySelected=${fst.onlySelected?'1':'0'}`);
    L.push(`%noConflicts=${fst.noConflicts?'1':'0'}`);
    return L.join('\n')+'\n';
  }

  function parseFileText(text){
    const parts=[], marks={}, filtered={}, filterRaw={};
    const oldPrioFromLabel = lbl => (lbl==='חובה'?'must':lbl==='אולי'?'maybe':lbl==='גיבוי'?'backup':null);
    text.split('\n').forEach(line=>{
      const t=line.trim();
      if(!t||t.startsWith('#')) return;
      if(t.startsWith('%')){
        const eq=t.indexOf('=');
        if(eq===-1) return;
        filterRaw[t.slice(1,eq).trim()] = t.slice(eq+1);
        return;
      }
      if(t.startsWith('@')){
        const f=t.slice(1).split('|').map(s=>s.trim());
        const id=Number(f[0]);
        if(!id||isNaN(id)) return;
        const age=f[2]===undefined||f[2]===''?'':Number(f[2]);
        parts.push({id, name:f[1]||'', age:isNaN(age)?'':age, color:PART_COLORS[(parts.length)%PART_COLORS.length]});
        return;
      }
      if(t.startsWith('!')){
        const id=t.slice(1).split('|')[0].trim();
        if(id && EVENTS_BY_ID.has(id)) filtered[id]=true;
        return;
      }
      const f=t.split('|').map(s=>s.trim());
      const id=f[0];
      if(!id||!EVENTS_BY_ID.has(id)) return;

      const partsObj={};
      if (f.length>=8){
        // legacy file (structure v2/v3): single event-wide priority/registered + plain assignment list.
        // migrated as a best-effort default status per already-assigned participant.
        const prio=oldPrioFromLabel(f[3]);
        const reg=f[4]==='כן';
        const status = reg ? 'reg' : (prio || 'dash');
        const pl=(f[5]&&f[5]!=='-')?f[5].split(',').map(x=>parseInt(x.trim(),10)).filter(x=>!isNaN(x)):[];
        pl.forEach(pid=>{ partsObj[pid]=status; });
      } else {
        // current format: id | date | time | assignStr | name | host
        const assignStr=f[3];
        if (assignStr && assignStr!=='-'){
          assignStr.split(',').forEach(pair=>{
            const bits=pair.split(':').map(s=>s.trim());
            const pid=parseInt(bits[0],10), status=bits[1];
            if (!isNaN(pid) && Object.prototype.hasOwnProperty.call(PSTATUS_LABEL,status)) partsObj[pid]=status;
          });
        }
      }
      marks[id]={parts:partsObj};
    });
    // an event that's actively selected can never also be filtered — selection wins
    Object.keys(marks).forEach(id=>{ delete filtered[id]; });
    const filters = {
      search: filterRaw.search || '',
      date: filterRaw.date || 'all',
      time: filterRaw.time || 'all',
      cat: filterRaw.cat || 'all',
      age: filterRaw.age || 'all',
      onlySelected: filterRaw.onlySelected==='1',
      noConflicts: filterRaw.noConflicts==='1'
    };
    return {parts, marks, filtered, filters};
  }

  function applyLoaded(data, sourceLabel){
    state.participants=[];
    data.parts.forEach(p=>state.participants.push(p));
    ensureSlots();
    // drop assignments pointing at participants that no longer exist
    const valid=new Set(state.participants.map(p=>p.id));
    state.marks={};
    Object.keys(data.marks).forEach(id=>{
      const m=data.marks[id];
      const cleanParts={};
      Object.keys(m.parts).forEach(pid=>{
        const n=Number(pid);
        if (valid.has(n)) cleanParts[n]=m.parts[pid];
      });
      state.marks[id]={parts:cleanParts};
    });
    state.filtered={};
    Object.keys(data.filtered||{}).forEach(id=>{
      if (!isSelected(id)) state.filtered[id]=true;
    });
    afterStateChange({rerenderParts:true, markDirty:false});
    applyFilterState(data.filters);
    setDirty(false);
    if(!panelParts.hidden) renderParts();
    const n=Object.keys(state.marks).length, np=activeParts().length, nf=filteredCount();
    toast(`נטענו ${n} אירועים, ${np} משתתפים${nf?` ו-${nf} מסוננים`:''}${sourceLabel?' '+sourceLabel:''}.`);
  }
